<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS 力量举训练计划</title>
<style>
:root {
  color-scheme: light;
  --red: #a6232d;
  --red-dark: #821b23;
  --tint: #fbeff0;
  --ink: #23262b;
  --muted: #555c66;
  --grid: #d9dce0;
  --wash: #f2f3f5;
  --paper: #fff;
  --field: #fcfcfd;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--wash); font-size: 14px; line-height: 1.6; }
header, main, footer { padding-inline: max(16px, calc((100% - 1240px) / 2)); }
.masthead { background: var(--paper); padding-top: 24px; padding-bottom: 22px; border-top: 5px solid var(--red); border-bottom: 1px solid var(--grid); }
p, h1, h2, h3 { margin: 0; }
h1 { font-size: clamp(27px, 4.6vw, 40px); line-height: 1.2; letter-spacing: -.04em; margin-block: 2px 10px; }
h2 { font-size: 23px; line-height: 1.3; }
h3 { font-size: 17px; }
.muted, .session-copy, .cues, .week-copy, .caption { color: var(--muted); }
.masthead time, .goal-values, .num, .rpe, .prescription { font-variant-numeric: tabular-nums; }
.goal-values { font-weight: 660; }
.toolbar { padding: 12px; margin: 14px 0; background: var(--paper); border: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.week-nav, .date-tools, .actions, .basis, .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
button, a.button, select, input, textarea { font: inherit; }
button, a.button, select { display: inline-block; background: var(--paper); border: 1px solid var(--grid); color: var(--ink); padding: 4px 10px; text-decoration: none; min-height: 34px; }
button, select { cursor: pointer; }
button:hover, a.button:hover { border-color: var(--red); color: var(--red); }
button.primary { background: var(--red); border-color: var(--red); color: white; }
button.primary:hover { background: var(--red-dark); }
a:not(.button) { color: var(--red-dark); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
input, textarea { color: var(--ink); border: 1px solid #bfc3c9; background: var(--field); padding: 3px 6px; min-height: 31px; border-radius: 0; }
input::placeholder, textarea::placeholder { color: #676d75; opacity: 1; }
input[type="number"] { width: 72px; appearance: textfield; }
input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.date-status { color: var(--muted); }
.status:empty { display: none; }
.status { margin: 0 0 8px; color: var(--muted); }
.status.error { color: var(--red-dark); font-weight: 650; }
.pitch, .guide, .week, .next-rules { background: var(--paper); border: 1px solid var(--grid); margin-bottom: 16px; }
summary { cursor: pointer; font-weight: 680; padding: 9px 12px; }
.details-body { padding: 0 12px 12px; }
.details-body p + p { margin-top: 8px; }
.details-body h3 { margin: 10px 0 4px; }
details .details-body ul { margin: 3px 0; padding-inline-start: 21px; }
.week-head { padding: 10px 12px; border-left: 4px solid var(--red); border-bottom: 1px solid var(--grid); }
.week-head h2 span { color: var(--red); padding-right: 8px; }
.week-copy, .session-copy, .caption, .cues { font-size: 13px; }
.week-copy { margin-top: 3px; }
.pivot-control { padding: 8px 12px; background: var(--tint); border-bottom: 1px solid var(--grid); }
.day + .day { border-top: 2px solid #b9bdc4; }
.day { scroll-margin-top: 10px; }
.day.selected { box-shadow: inset 0 0 0 2px var(--red); }
.day-heading { padding: 10px 12px 7px; background: var(--wash); }
.day-heading .date { color: var(--red-dark); font-weight: 680; margin-right: 8px; white-space: nowrap; }
.day-heading h3 { display: inline; }
.session-copy { margin-top: 4px; }
.basis { margin-top: 7px; gap: 6px 13px; }
.basis label, .session-log label { display: inline-flex; align-items: center; gap: 6px; }
.basis output { font-size: 13px; color: var(--muted); }
.table-scroll { overflow-x: auto; }
table { table-layout: fixed; width: 100%; border-collapse: collapse; }
th, td { border: 1px solid var(--grid); padding: 6px 8px; text-align: center; vertical-align: middle; }
th:first-child, td:first-child { text-align: left; border-left: 0; }
th:last-child, td:last-child { border-right: 0; }
thead th { background: #e9eaed; color: #353b43; font-size: 12px; }
tbody th { font-weight: 620; }
tbody tr:nth-child(even) > * { background: #fafafb; }
.plan-table { min-width: 865px; }
.plan-table .exercise { width: 25%; }
.plan-table .scheme { width: 8%; }
.plan-table .intensity { width: 10%; }
.plan-table .load { width: 13%; }
.plan-table .record { width: 8.8%; }
.plan-table output { display: block; }
.plan-table input { width: 100%; text-align: center; }
.plan-table .exercise-note { display: block; font-weight: 400; margin-top: 2px; color: var(--muted); font-size: 12px; }
.plan-table .test-load, .plan-table .weight { font-weight: 700; }
.plan-table .load-note { display: block; font-size: 11px; line-height: 1.4; font-weight: 430; color: var(--muted); }
.plan-table .is-reduced, .plan-table .over { color: var(--red-dark); background: var(--tint); }
.plan-table .gate { color: var(--muted); font-size: 12px; }
.plan-table .gate.ok { color: var(--ink); font-weight: 650; }
.plan-table .gate.closed { color: var(--red-dark); }
.session-log { padding: 0 12px 10px; }
.session-log .inline { margin-bottom: 6px; gap: 8px 14px; }
.session-log label { align-items: center; }
.session-log textarea { display: block; width: 100%; min-height: 44px; resize: vertical; }
.session-log summary { padding-inline: 0; }
.overview-table { min-width: 645px; }
.overview-table th:first-child { width: 19%; }
.trend th:first-child { width: 12%; }
.data-note { padding: 6px 12px; color: var(--muted); font-size: 13px; }
footer { color: var(--muted); padding-top: 4px; padding-bottom: 16px; font-size: 13px; }
@media screen and (max-width: 900px) {
  .table-scroll { overflow: visible; }
  .plan-table, .overview-table, .plan-table tbody, .overview-table tbody {
    display: block;
    min-width: 0;
  }
  .plan-table colgroup { display: none; }
  .plan-table thead, .overview-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .plan-table tbody tr, .overview-table tbody tr {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    border-bottom: 1px solid var(--grid);
  }
  .plan-table tbody th, .overview-table tbody th {
    grid-column: 1 / -1;
    min-width: 0;
    width: auto;
    border: 0;
    padding: 7px 10px;
    background: var(--wash);
    overflow-wrap: anywhere;
  }
  .plan-table tbody td, .overview-table tbody td {
    min-width: 0;
    border: 0;
    padding: 5px 7px 6px;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .plan-table td[data-label]::before, .overview-table td[data-label]::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.3;
  }
  .plan-table td:nth-child(n+2):nth-child(-n+4),
  .overview-table td:nth-child(n+6) { grid-column: span 4; }
  .plan-table td:nth-child(n+5):nth-child(-n+8),
  .overview-table td:nth-child(n+2):nth-child(-n+5) { grid-column: span 3; }
  .plan-table td:nth-child(n+5):nth-child(-n+8) { border-top: 1px solid var(--grid); }
  .plan-table :is(input, select) {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 3px 4px;
  }
  .plan-table td.assessment {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 0;
  }
  .plan-table .assessment select { width: auto; min-width: 82px; }
  .plan-table td.assessment-empty { display: none; }
  .details-body { overflow-wrap: anywhere; }
}
@media screen and (max-width: 660px) {
  body { font-size: 13px; }
  header, main, footer { padding-inline: 10px; }
  .toolbar { padding: 8px; }
  .day :is(input, select, textarea) { font-size: 16px; }
}
@media print {
  body { background: white; font-size: 10px; }
  header, main { padding-inline: 0; }
  .toolbar, .status, footer, .basis, .session-log, .pivot-control, .guide:not([open]) { display: none; }
  .table-scroll { overflow: visible; }
  .plan-table, .overview-table { min-width: 0; }
  .plan-table input { border: 0; padding: 0; }
  .day { break-inside: avoid; }
}
</style>
</head>

11÷97.8%≈215.7 kg，深蹲 140÷83.7%≈167.3 kg，硬拉 150÷86.3%≈173.8 kg。三项开训参考依次为 215、167.5、175 kg。它们是训练参考；评估当天状态只需在对应动作栏填写当日 e1RM。\u003c/p>\n\u003cp>建议公斤数 = 当日或趋势参考 e1RM ×（固定比例或 RTS 对应次数和起重 RPE 的比例），按 2.5 kg 就近取整。赛推参考下沿为建议重量减 5 kg，当天动作或热身偏难可继续降。任何单项的反馈只更新该项；周日赛推无周六蹲拉扣减项。动作失控或出现疼痛时，结束该动作。\u003c/p>\n\u003ch3>回组与实际训练量\u003c/h3>\n\u003cp>常规 T&amp;G 起始参考为 207.5 kg，无腿窄距为 200 kg。两者随当天赛停参考相对起始值的变化暂作等公斤调整，仍以同变式实做校准。起重 RPE 是第一组的换算参考，目标／上限列用于限制末组。首组超标时下一组降 2.5–5 kg；达到上限的组计入并结束。逐组重量不同时，把实际重量栏填为最后一组，并在备注写明各组。\u003c/p>\n\u003cp>主项回组组间休 3–5 分钟，重单次休 5–8 分钟，器械休 1–2 分钟。器械配重和双杠额外挂重按当场 RPE 选择。推④的两组是常规容量；加第 3、4 组的条件写在 W5–6 当天。\u003c/p>\n\u003ch3>跨周进阶和过渡\u003c/h3>\n\u003cp>赛推用周日重单次，深蹲与硬拉用周六各自的标准单次。填实做重量、组数、次数“1”、实际 RPE，并选择“合格”。@7–9 的合格观测用于更新趋势。最近两个间隔不超过 21 天的可比观测均高于或低于当前参考至少 2.5 kg 时，同向调 2.5 kg；两次均须未超当天上限 0.5 档以上。最近 10 天内一次合格单次超上限超过 0.5 档，该项起训参考暂减 2.5 kg，直到获得下一次有效观测或超过十天，可用当日输入覆盖。周日赛推只读取卧推自己的观测。\u003c/p>\n\u003cp>W2–4 的同日处方用于判断训练反应。同重量更轻或同 RPE 更重时，继续原刺激。W4 可在开始前选短过渡，用于连续两次同条件表现下滑并伴随回组更费力的情况；周日重推仍为 @8。W7 通过减少回组降低总量，W8 以当天实际试举决定是否继续。\u003c/p>\n\u003ch3>第 8 周验收\u003c/h3>\n\u003cp>表中的条件试举先显示公斤数。把前置单次的实际重量、实做组数 1、实做次数 1、RPE 与动作判定录全，页面才会显示“可尝试”。验收目标保留，180/190 kg 若超过当天能力就停在已合格档位。215 kg 赛停必须动作合格、实际 RPE ≤9 才算达标。填入目标组的实绩后，目标行会显示验收结果。\u003c/p>\n","evidence":"\n\u003cul>\n\u003cli>赛停基准来自 11 月 15 日严格赛停 211 kg @9.5（本人评级）。比赛记录为 200.5 与 211 kg 成功，216 kg 失败。T&amp;G 的 220 kg 记录用于理解训练背景。\u003c/li>\n\u003cli>9–11 月备赛日志中，30 次有可比 RPE 上限的记录里有 14 次超标。10 月 29 日睡眠质量差时 205 kg 已到 @10，随后 10 月 31 日和 11 月 1 日均有 212.5 kg 赛停 @10。周日重推保留，周六卧推以技术单次和低 RPE T&amp;G 为主。\u003c/li>\n\u003cli>同一档 170 kg 4×5 曾分别记录 @8 与 @6.5。轻 T&amp;G、标准赛停和无腿窄距分别给处方。深蹲 140×5 @9 和硬拉 150×3 @8 来自你确认的近期 PR。两项都按自己的 RPE、技术和完成量进阶。\u003c/li>\n\u003cli>历史资料：训练日志、220 kg 备赛实做、Road to 230 kg、\u003ca href=\"https://q2563114335-eng.github.io/8-week-powerlifting-plan/\" rel=\"noreferrer\">原八周动作表\u003c/a>。\u003c/li>\n\u003cli>方法参考：\u003ca href=\"https://store.reactivetrainingsystems.com/blogs/uncategorized/weekly-progressions-and-training-expectations\" rel=\"noreferrer\"> ":"curl"},"w4d4":{"0":"btop","1":"tbo","2":"press","3":"incline","4":"shoulder","5":"fly","6":"pulldown","7":"row","8":"lateral","9":"biceps","10":"triceps"},"w5d1":{"0":"svol","1":"btop","2":"close","leg-ext":"ext","hip-out":"abd","hip-in":"add"},"w5d2":{"0":"btop","1":"tvol","2":"dip","3":"row","4":"fly"},"w5d3":{"0":"stop","1":"sbo","2":"btop","sat-tng":"tbo","3":"dtop","4":"dbo","leg-press":"legpress","leg-ext":"ext","leg-curl":"curl"},"w5d4":{"0":"btop","1":"tbo","2":"press","3":"incline","4":"shoulder","5":"fly","6":"pulldown","7":"row","8":"lateral","9":"biceps","10":"triceps"},"w6d1":{"0":"svol","1":"btop","2":"close","leg-ext":"ext","hip-out":"abd","hip-in":"add"},"w6d2":{"0":"btop","1":"tvol","2":"dip","3":"row","4":"fly"},"w6d3":{"0":"stop","1":"sbo","2":"btop","sat-tng":"tbo","3":"dtop","4":"dbo","leg-press":"legpress","leg-ext":"ext","leg-curl":"curl"},"w6d4":{"0":"btop","1":"tbo","2":"press","3":"incline","4":"shoulder","5":"fly","6":"pulldown","7":"row","8":"lateral","9":"biceps","10":"triceps"},"w7d1":{"0":"svol","1":"btop","2":"close","leg-ext":"ext","hip-out":"abd","hip-in":"add"},"w7d2":{"0":"btop","1":"tvol","2":["负重双杠臂屈伸"],"3":"row","4":"fly"},"w7d3":{"0":"stop","1":"sbo","2":"btop","sat-tng":"tbo","3":"dtop","4":"dbo","leg-press":"legpress","leg-ext":"ext","leg-curl":"curl"},"w7d4":{"0":"btop","1":"tbo","2":["固定器械平板推胸"],"3":["固定器械上斜推胸"],"4":["器械推肩"],"5":["蝴蝶机夹胸"],"6":"pulldown","7":"row","8":["侧平举"],"9":["二头弯举"],"10":["三头绳索下压"]},"w8d1":{"0":["深蹲 · 技术"],"1":"btop","2":["无腿窄距 T&G · 回组"],"leg-ext":["腿屈伸"],"hip-out":["髋外展"],"hip-in":["髋内收"]},"w8d2":{"0":"btop","1":"tvol","2":["负重双杠臂屈伸"],"3":["胸托划船"],"4":["反向蝴蝶机"]},"w8d3":{"0":["深蹲 · 评估单次"],"1":["深蹲 · 条件单次"],"2":["深蹲 · 条件单次"],"3":["深蹲 · 目标测试"],"4":"btop","5":["硬拉 · 评估单次"],"6":["硬拉 · 条件单次"],"7":["硬拉 · 条件单次"],"8":["硬拉 · 目标测试"],"sat-tng":["常规 T&G · 回组"],"leg-press":["倒蹬（腿举）"],"leg-ext":["腿屈伸"],"leg-curl":["腿弯举"]},"w8d4":{"0":["赛推 · 首个评估单次"],"1":["赛推 · 条件单次"],"2":["赛推 · 目标测试"],"3":["常规 T&G · 回组"],"4":[" <script>"use strict";

const rtsColumn = [
  1.000, .978, .955, .939, .922, .907, .892, .878, .863, .850, .837, .824,
  .811, .799, .786, .774, .762, .751, .739, .728, .717, .707, .696, .686,
  .676, .666, .656
];
const roundTo = (value, increment = 2.5) => Math.round(value / increment) * increment;
const limit = (value, lower, upper) => Math.min(upper, Math.max(lower, value));
const finite = (value) => value !== "" && value != null && Number.isFinite(Number(value));
const format = (value) => Number(value.toFixed(2)).toString();
const STRENGTH_KEYS = ["b", "s", "d"];
const FAMILY = {b: "赛推", s: "深蹲", d: "硬拉", t: "常规 T&G", c: "无腿窄距"};

function rtsRatio(reps, rpe) {
  if (!Number.isInteger(reps) || reps < 1 || reps > 12 || rpe < 6 || rpe > 10) return null;
  const index = (reps + 10 - rpe - 1) * 2;
  if (!Number.isFinite(index) || index >= rtsColumn.length) return null;
  const lower = Math.floor(index);
  const upper = Math.ceil(index);
  if (upper >= rtsColumn.length) return null;
  return rtsColumn[lower] + (rtsColumn[upper] - rtsColumn[lower]) * (index - lower);
}

function observedEstimate(row, log) {
  if (!row.anchor || log.form !== "ok" || !finite(log.kg) || !finite(log.last)) return null;
  const weight = Number(log.kg);
  const rpe = Number(log.last);
  if (!finite(log.sets) || Number(log.sets) < 1 || String(log.reps).trim() !== "1"
      || rpe < 7 || rpe > 9 || weight <= 0) return null;
  const estimate = weight / rtsRatio(1, rpe);
  return {family: row.family, weight, rpe, estimate, high: rpe > row.cap + .5};
}

function getPivotRow(row) {
  if (!row.pivot) return row;
  return {...row, ...row.pivot, anchor: false};
}

function anchorsBefore(program, state, session, family) {
  const reference = program.baselines[family];
  let estimate = reference;
  const history = [];
  for (const day of program.sessions) {
    if (day.date >= session.date) break;
    const candidate = day.rows.find((row) => row.family === family && row.anchor);
    if (!candidate || state.modes[day.week] === "pivot") continue;
    const sample = observedEstimate(candidate, state.records[day.id + "-" + candidate.id] ?? {});
    if (!sample) continue;
    const prior = history.at(-1);
    history.push({...sample, date: day.date});
    if (!prior || daysBetween(prior.date, day.date) > 21 || sample.high || prior.high) continue;
    const bothAbove = Math.min(prior.estimate, sample.estimate) >= estimate + 2.5;
    const bothBelow = Math.max(prior.estimate, sample.estimate) <= estimate - 2.5;
    if (bothAbove) estimate += 2.5;
    if (bothBelow) estimate -= 2.5;
  }
  return {estimate: roundTo(estimate), history};
}

function daysBetween(start, finish) {
  return (Date.parse(finish) - Date.parse(start)) / 86_400_000;
}

function loadSuggestion(row, day, program, state) {
  if (row.fixed != null) return {weight: row.fixed, source: "试举重量", reduced: false};
  if (row.fixedRange) return {source: row.fixedRange};
  if (!row.family || row.first == null && row.rate == null) return {source: "按 RPE"};
  const related = row.family === "t" || row.family === "c" ? "b" : row.family;
  const trend = anchorsBefore(program, state, day, related);
  const userToday = state.daily[day.id]?.[related];
  const prior = trend.history.at(-1);
  const recentlyHigh = prior?.high && daysBetween(prior.date, day.date) <= 10;
  const withinSession = finite(userToday) && Number(userToday) >= 30 && Number(userToday) <= 600;
  const dayBase = withinSession ? Number(userToday) : trend.estimate - (recentlyHigh ? 2.5 : 0);
  let baseline = dayBase;
  if (related !== row.family) {
    baseline = program.baselines[row.family] + (dayBase - program.baselines.b);
  }
  const baselineFactor = row.rate ?? rtsRatio(row.reps, row.first);
  if (!baselineFactor) return {source: "按 RPE"};
  const original = roundTo(Math.max(20, baseline * baselineFactor));
  const weight = row.maxWeight == null ? original : Math.min(original, row.maxWeight);
  return {weight, reduced: recentlyHigh || weight < original || dayBase < trend.estimate,
    source: row.rate ? format(row.rate * 100) + "%" : "起重 @" + format(row.first)};
}

function previousDone(row, log, maxRpe, minWeight, maxWeight) {
  if (!log || !log.form || !finite(log.kg) || !finite(log.last) || !finite(log.sets)
      || String(log.reps).trim() !== "1") return null;
  return log.form === "ok" && Number(log.sets) >= 1 && Number(log.kg) >= (minWeight ?? row.fixed ?? 0)
    && (maxWeight == null || Number(log.kg) <= maxWeight)
    && Number(log.last) >= 6 && Number(log.last) <= maxRpe;
}

function gateStatus(gate, program, state) {
  if (!gate) return "open";
  let waiting = false;
  for (const option of gate) {
    const outcome = option.map((rule) => {
      const day = program.sessions.find((entry) => entry.id === rule.day);
      const row = day.rows.find((entry) => entry.id === rule.row);
      if (state.modes[day.week] === "pivot") return false;
      const priorGate = gateStatus(row.gate, program, state);
      if (priorGate === "closed") return false;
      if (priorGate === "waiting") return null;
      return previousDone(row, state.records[day.id + "-" + row.id], rule.cap, rule.kg, rule.maxKg);
    });
    if (outcome.every((result) => result === true)) return "open";
    if (!outcome.includes(false)) waiting = true;
  }
  return waiting ? "waiting" : "closed";
}

function plannedReps(day, mode) {
  const counts = {b: 0, s: 0, d: 0, conditional: 0};
  for (const original of day.rows) {
    const row = mode === "pivot" ? getPivotRow(original) : original;
    if (!row.family || !Number(row.sets) || !Number(row.reps)) continue;
    const family = row.family === "t" || row.family === "c" ? "b" : row.family;
    if (row.gate) counts.conditional += row.sets * row.reps;
    else counts[family] += row.sets * row.reps;
  }
  return counts;
}

const element = (id) => document.getElementById(id);
const program = JSON.parse(element("program").textContent);
const embedded = JSON.parse(element("saved-records").textContent);
const storageKey = "rts-powerlifting-" + program.version;
const recover = (data) => ({
  records: data?.records ?? {}, daily: data?.daily ?? {}, modes: data?.modes ?? {},
  legacyImported: data?.legacyImported ?? false, savedAt: data?.savedAt ?? 0
});
let state = recover(embedded);
try {
  const browserCopy = JSON.parse(localStorage.getItem(storageKey));
  if (browserCopy && (browserCopy.savedAt ?? 0) > (embedded?.savedAt ?? 0)) state = recover(browserCopy);
} catch (_) {
  report("当前浏览器限制自动保存。训练后可下载含记录的副本。", false);
}

function importLegacyRecords() {
  if (state.legacyImported || !program.legacy) return;
  const prefix = "sbd-2026-11-17-html:";
  const readOld = (key) => localStorage.getItem(prefix + key)?.trim() || "";
  let imported = false;
  try {
    for (const [dayId, rows] of Object.entries(program.legacy)) {
      const additions = [];
      const estimate = readOld(dayId + "-e1rm");
      const note = readOld(dayId + "-note");
      if (note) additions.push("原版备注：" + note);
      if (estimate) additions.push("原版当日赛停 e1RM：" + estimate + " kg");
      for (const [oldRow, match] of Object.entries(rows)) {
        const oldKey = dayId + "-" + oldRow;
        const kg = readOld(oldKey + "-kg");
        const last = readOld(oldKey + "-rpe");
        const work = readOld(oldKey + "-work");
        const split = /^\s*(\d+)\s*(?:组\s*[×xX*＊✕]?|[×xX*＊✕])\s*(\d+(?:\s*[,，/、]\s*\d+)*)\s*次?\s*$/.exec(work);
        const values = {
          kg, last, sets: readOld(oldKey + "-sets") || split?.[1] || "",
          reps: readOld(oldKey + "-reps") || split?.[2] || work,
        };
        if (!Object.values(values).some(Boolean)) continue;
        if (Array.isArray(match)) {
          const description = [["重量", "kg"], ["RPE", "last"], ["组数", "sets"], ["次数", "reps"]]
            .filter(([, key]) => values[key]).map(([name, key]) => name + " " + values[key]).join("，");
          additions.push("原版 " + match[0] + "：" + description);
          continue;
        }
        const record = state.records[dayId + "-" + match] ??= {};
        const label = program.sessions.find((day) => day.id === dayId).rows.find((row) => row.id === match).name;
        for (const [field, value] of Object.entries(values)) {
          if (!value) continue;
          const numeric = Number(value);
          const valid = field === "reps" || finite(value) && (
            field === "kg" ? numeric >= 0 && numeric <= 650 :
            field === "sets" ? Number.isInteger(numeric) && numeric >= 0 && numeric <= 20 :
            numeric >= 1 && numeric <= 10 && Number.isInteger(numeric * 2));
          const normalized = field === "reps" ? value : String(numeric);
          if (valid && !Object.hasOwn(record, field)) {
            record[field] = normalized;
            imported = true;
          } else if (!valid || String(record[field]) !== normalized) {
            const column = {kg: "重量", last: "RPE", sets: "组数", reps: "次数"}[field];
            additions.push("原版 " + label + " " + column + "：" + value);
          }
        }
      }
      if (additions.length) {
        const daily = state.daily[dayId] ??= {};
        daily.note = [daily.note, ...additions].filter(Boolean).join("\n");
        imported = true;
      }
    }
    state.legacyImported = true;
    if (imported) save();
  } catch (_) {
    report("无法读取原版记录。仍可在当前页面记录训练。", true);
  }
}

const escapedChars = {"&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"};
const html = (value) => String(value ?? "").replace(/[&<>"']/g, (match) => escapedChars[match]);
const selected = (actual, option) => actual === option ? " selected" : "";
const dateText = (date) => date.slice(5).replace("-", ".");
function domDate(date) {
  const parts = new Intl.DateTimeFormat("en", {
    timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(({type, value}) => [type, value]));
  return values.year + "-" + values.month + "-" + values.day;
}

function report(message, error = false) {
  element("status").textContent = message;
  element("status").classList.toggle("error", error);
}

function save() {
  state.savedAt = Date.now();
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (_) {
    report("自动保存不可用。请下载含记录的副本。", true);
  }
}

function numField(id, field, label, {value, scope = "record", min, max, step = "any"}) {
  return `<input type="number" inputmode="${step === 1 ? "numeric" : "decimal"}" aria-label="${html(label)}" data-scope="${scope}" data-key="${html(id)}" data-field="${field}" min="${min}" max="${max}" step="${step}" value="${html(value)}" autocomplete="off">`;
}

function selector(id, field, label, value, options, scope = "record") {
  return `<select aria-label="${html(label)}" data-scope="${scope}" data-key="${html(id)}" data-field="${field}">${options.map(([key, text]) =>
    `<option value="${key}"${selected(value, key)}>${text}</option>`).join("")}</select>`;
}

function rowCells(original, day, mode) {
  const row = mode === "pivot" ? getPivotRow(original) : original;
  const id = day.id + "-" + row.id;
  const log = state.records[id] ?? {};
  const name = row.name;
  const repsLabel = html(row.reps);
  const archived = row.archived;
  const optional = row.optional && !row.gate;
  const intensity = archived ? row.display : row.gate ? "≤" + row.cap
    : row.display ?? (row.cap == null ? "—" : "≤" + row.cap);
  const assessment = row.anchor || row.test || original.anchor;
  const logField = (field, label, min, max, step) =>
    numField(id, field, name + " " + label, {value: log[field], min, max, step});
  const displayStatus = !row.sets ? "休息" : `${row.sets} × ${repsLabel}${optional ? "（可选）" : ""}`;
  return `<tr id="row-${id}" role="row"><th scope="row" role="rowheader">${html(name)}${row.note ? `<span class="exercise-note">${html(row.note)}</span>` : ""}</th>
    <td role="cell" data-label="组×次">${displayStatus}</td>
    <td role="cell" data-label="目标 / 上限">${html(intensity)}</td>
    <td role="cell" id="load-${id}" data-label="建议 kg"></td>
    <td role="cell" data-label="实做 kg">${logField("kg", "实际 kg", 0, 650)}</td>
    <td role="cell" data-label="实做组数">${logField("sets", "实做组数", 0, 20, 1)}</td>
    <td role="cell" data-label="实做次数"><input type="text" aria-label="${html(name)} 每组实做次数" data-scope="record" data-key="${id}" data-field="reps" value="${html(log.reps)}" inputmode="text" autocomplete="off"></td>
    <td role="cell" data-label="末组 RPE">${logField("last", "实际末组 RPE", 1, 10, 0.5)}</td>
    <td role="cell" class="${assessment ? "assessment" : "assessment-empty"}" data-label="动作判定">${assessment ? selector(id, "form", name + " 动作判定", log.form,
      [["", "待记"], ["ok", "合格"], ["bad", "未达标"]]) : "—"}</td></tr>`;
}

function sessionCard(day) {
  const mode = state.modes[day.week];
  const variables = state.daily[day.id] ?? {};
  const inputs = STRENGTH_KEYS.filter((key) => day.rows.some((r) =>
    r.family === key || key === "b" && (r.family === "t" || r.family === "c")));
  const perDayInput = inputs.map((key) => `<label>${FAMILY[key]} e1RM
    ${numField(day.id, key, FAMILY[key] + " 当日 e1RM", {value: variables[key], scope: "daily", min: 30, max: 600})}
    <output id="basis-${day.id}-${key}"></output></label>`).join("");
  const noteFields = [
    ["sleep", "睡眠（h）", 0, 24, 0.25], ["legs", "腿部疲劳", 0, 3, 1],
    ["back", "腰背疲劳", 0, 3, 1], ["push", "推肌疲劳", 0, 3, 1]
  ];
  return `<section class="day" id="${day.id}" tabindex="-1" aria-labelledby="${day.id}-title">
    <div class="day-heading"><time class="date" datetime="${day.date}">${dateText(day.date)} · ${html(day.dayLabel)}</time><h3 id="${day.id}-title">${html(day.title)}</h3>
    <p class="session-copy">${html(mode === "pivot" ? day.pivotCopy ?? day.copy : day.copy)}</p>
    ${perDayInput && !day.archived ? `<div class="basis">${perDayInput}</div>` : ""}</div>
    <div class="table-scroll"><table class="plan-table" role="table" aria-label="${html(day.title)}训练明细">
    <colgroup><col class="exercise"><col class="scheme"><col class="intensity"><col class="load"><col class="record"><col class="record"><col class="record"><col class="record"><col class="record"></colgroup>
    <thead role="rowgroup"><tr role="row"><th scope="col">动作</th><th scope="col">组×次</th><th scope="col">目标 / 上限</th><th scope="col">建议 kg</th>
    <th scope="col">实做 kg</th><th scope="col">实做组数</th><th scope="col">实做次数<br>逐组可用 /</th><th scope="col">末组 RPE</th><th scope="col">动作判定</th></tr></thead>
    <tbody role="rowgroup">${day.rows.map((row) => rowCells(row, day, mode)).join("")}</tbody></table></div>
    <details class="session-log" id="notes-${day.id}"><summary>恢复与训练备注</summary>
    <div class="inline">${noteFields.map(([field, label, min, max, step]) =>
      `<label>${label}${numField(day.id, field, label, {value: variables[field], scope: "daily", min, max, step})}</label>`).join("")}
      <span class="muted">疲劳 0 无，1 轻，2 明显，3 影响动作</span></div>
    <label for="note-${day.id}">首组 RPE、逐组变重或动作备注</label>
    <textarea id="note-${day.id}" data-scope="daily" data-key="${day.id}" data-field="note" rows="2">${html(variables.note)}</textarea></details></section>`;
}

function renderWeeks() {
  const openNotes = new Set(Array.from(document.querySelectorAll(".session-log[open]"), (note) => note.id));
  element("weeks").innerHTML = program.weeks.map((week, idx) => {
    const index = idx + 1;
    const days = program.sessions.filter((day) => day.week === index);
    if (!days.length) return "";
    return `<article class="week" id="w${index}">
        <div class="week-head"><h2><span>W${index}</span>${html(week.title)}</h2>
        <p class="week-copy">${dateText(days[0].date)}–${dateText(days.at(-1).date)} · ${html(week.copy)}</p></div>
        ${week.pivot ? `<div class="pivot-control"><label>本周执行
        ${selector(String(index), "mode", "W" + index + "执行方式", state.modes[index], [["", "按表发展"], ["pivot", "切换过渡周"]], "mode")}</label>
        <span class="muted"> 仅在本周开始前选择。已填写的实做记录会保留。</span></div>` : ""}
        ${days.map(sessionCard).join("")}</article>`;
  }).join("");
  for (const id of openNotes) {
    if (element(id)) element(id).open = true;
  }
}

function displayWeight(row, day, output) {
  if (!row.sets) return "<span class=\"muted\">—</span>";
  if (row.archived) return row.fixed != null ? `<output class="weight">${html(row.fixed)}</output>` : html(row.fixedRange ?? "按 RPE");
  const gate = gateStatus(row.gate, program, state);
  if (row.gate) {
    let label = {open: "可尝试", waiting: "待确认前置组", closed: "前置组未达标"}[gate];
    let className = gate === "open" ? "ok" : gate === "closed" ? "closed" : "";
    if (row.result) {
      const log = state.records[day.id + "-" + row.id];
      const done = previousDone(row, log, row.cap, row.fixed, row.fixed);
      if (done !== null) {
        label = done ? "验收达成" : "验收未达成";
        className = done ? "ok" : "closed";
      }
    }
    return `<output class="test-load">${output.weight}</output><span class="gate ${className}">${label}</span>`;
  }
  if (output.weight == null) return `<span class="muted">${html(output.source)}</span>`;
  const lower = row.floorGuide ? " · 参考下沿 " + format(Math.max(20, output.weight - 5)) : "";
  return `<output class="weight${output.reduced ? " is-reduced" : ""}">${format(output.weight)}</output><span class="load-note">${html(output.source + lower)}</span>`;
}

function updateSuggestions() {
  for (const day of program.sessions) {
    for (const family of STRENGTH_KEYS) {
      const output = element("basis-" + day.id + "-" + family);
      if (!output) continue;
      const trend = anchorsBefore(program, state, day, family);
      const input = state.daily[day.id]?.[family];
      const prior = trend.history.at(-1);
      const offset = prior?.high && daysBetween(prior.date, day.date) <= 10 ? 2.5 : 0;
      output.textContent = finite(input) && Number(input) >= 30 && Number(input) <= 600
        ? "采用当日输入" : "参考 " + format(trend.estimate - offset);
    }
    const mode = state.modes[day.week];
    for (const original of day.rows) {
      const row = mode === "pivot" ? getPivotRow(original) : original;
      const id = day.id + "-" + row.id;
      const tile = element("load-" + id);
      tile.innerHTML = displayWeight(row, day, loadSuggestion(row, day, program, state));
      const rpe = state.records[id]?.last;
      const above = row.cap != null && finite(rpe) && Number(rpe) > row.cap;
      element("row-" + id).cells[7].classList.toggle("over", above);
    }
  }
}

function updateOverview() {
  const summaries = program.weeks.map((week, idx) => {
    const weekNo = idx + 1;
    const mode = state.modes[weekNo];
    const counts = {b: 0, s: 0, d: 0, conditional: 0};
    const recorded = {};
    for (const day of program.sessions.filter((item) => item.week === weekNo)) {
      const dayCounts = plannedReps(day, mode);
      for (const key of Object.keys(dayCounts)) counts[key] += dayCounts[key];
      if (mode === "pivot") continue;
      for (const row of day.rows.filter((item) => item.anchor)) {
        const result = observedEstimate(row, state.records[day.id + "-" + row.id] ?? {});
        if (result) recorded[row.family] = `${format(result.weight)} @${format(result.rpe)} · ${Math.round(result.estimate)}`;
      }
    }
    return `<tr role="row"><th scope="row" role="rowheader">W${weekNo} · ${html(mode === "pivot" ? "过渡" : week.title)}</th>
    <td role="cell" data-label="卧推次数">${counts.b}</td>
    <td role="cell" data-label="深蹲次数">${counts.s}</td>
    <td role="cell" data-label="硬拉次数">${counts.d}</td>
    <td role="cell" data-label="条件试举">${counts.conditional || "—"}</td>
    ${STRENGTH_KEYS.map((key) => `<td role="cell" data-label="${FAMILY[key]}观测">${recorded[key] ?? "—"}</td>`).join("")}</tr>`;
  }).join("");
  element("overview").innerHTML = `<table class="overview-table" role="table"><thead role="rowgroup"><tr role="row"><th scope="col">训练周</th>
    <th scope="col">卧推次数</th><th scope="col">深蹲次数</th><th scope="col">硬拉次数</th>
    <th scope="col">条件试举</th><th scope="col">赛推观测</th><th scope="col">深蹲观测</th><th scope="col">硬拉观测</th></tr>
    </thead><tbody role="rowgroup">${summaries}</tbody></table>`;
}

function locateSession(date, scroll = true) {
  document.querySelector(".day.selected")?.classList.remove("selected");
  const day = program.sessions.find((item) => item.date >= date);
  if (!day) return "本轮计划已结束";
  const exact = day.date === date;
  const section = element(day.id);
  section.classList.add("selected");
  if (scroll) {
    section.focus({preventScroll: true});
    section.scrollIntoView({behavior: "auto", block: "start"});
  }
  if (exact) return "已定位当天训练";
  return date < program.sessions[0].date ? "首练 " + day.date : "今日休息，下次训练 " + day.date;
}

async function getDateFromServer() {
  if (!["https:", "http:"].includes(location.protocol)) return null;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);
  try {
    const url = new URL(location.href);
    url.hash = "";
    url.search = "";
    url.searchParams.set("clock", Math.random().toString(36).slice(2));
    const response = await fetch(url, {method: "HEAD", cache: "no-store", signal: controller.signal});
    if (!response.ok) return null;
    const header = response.headers.get("Date");
    const timestamp = header ? Date.parse(header) : NaN;
    const age = Number(response.headers.get("Age")) || 0;
    return Number.isFinite(timestamp) ? new Date(timestamp + Math.max(0, age) * 1000) : null;
  } catch (_) {
    return null;
  } finally {
    clearTimeout(timeout);
  }
}

let checkedDate = "";
let checkingDate = false;

async function locateToday({forceScroll = false, respectAnchor = false} = {}) {
  if (checkingDate) return;
  checkingDate = true;
  try {
    const serverDate = await getDateFromServer();
    const date = domDate(serverDate ?? new Date());
    const scroll = forceScroll || date !== checkedDate && !(respectAnchor && location.hash);
    const result = locateSession(date, scroll);
    element("date-status").textContent = `${date} 北京时间 · ${result}${serverDate ? "" : " · 设备时间"}`;
    element("today").hidden = !program.sessions.some((day) => day.date >= date);
    checkedDate = date;
  } finally {
    checkingDate = false;
  }
}

function downloadCopy() {
  const root = document.documentElement.cloneNode(true);
  root.querySelector("#saved-records").textContent = JSON.stringify({...state, savedAt: Date.now()}).replace(/</g, "\\u003c");
  for (const id of ["weeks", "overview", "week-nav", "status"]) root.querySelector("#" + id).replaceChildren();
  root.querySelector("#date-status").textContent = "正在获取日期…";
  root.querySelector("#today").hidden = true;
  const file = new Blob(["<!DOCTYPE html>\n" + root.outerHTML], {type: "text/html;charset=utf-8"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = program.filename.replace(".html", "-with-log.html");
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  report("已生成含当前记录的副本。");
}

element("main-title").textContent = program.title;
element("period").textContent = program.sessions[0].date + " 至 " + program.sessions.at(-1).date;
element("goals").textContent = program.goals;
element("rules").innerHTML = program.rules;
element("evidence").innerHTML = program.evidence;
element("trend-note").textContent = program.trendNote;
element("week-nav").innerHTML = program.weeks.map((_, index) =>
  `<a class="button" href="#w${index + 1}">W${index + 1}</a>`).join("");
element("today").addEventListener("click", () => { void locateToday({forceScroll: true}); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") void locateToday();
});
element("save-file").addEventListener("click", downloadCopy);
element("weeks").addEventListener("input", (event) => {
  const field = event.target;
  const {scope, key, field: name} = field.dataset;
  if (!scope || field.validity?.valid === false) return;
  if (scope === "mode") {
    const weekDays = program.sessions.filter((day) => day.week === Number(key));
    const hasLog = weekDays.some((day) => day.rows.some((row) =>
      Object.values(state.records[day.id + "-" + row.id] ?? {}).some((value) => value !== "")));
    if (hasLog) {
      field.value = state.modes[key] ?? "";
      report("本周已有实做记录。训练表保留当时选定的处方。", true);
      return;
    }
    state.modes[key] = field.value;
    renderWeeks();
    document.querySelector(`[data-scope="mode"][data-key="${key}"]`)?.focus();
  } else {
    const map = scope === "record" ? state.records : state.daily;
    (map[key] ??= {})[name] = field.value;
  }
  save();
  if (scope !== "daily" || STRENGTH_KEYS.includes(name)) {
    updateSuggestions();
    updateOverview();
  }
});
importLegacyRecords();
renderWeeks();
updateSuggestions();
updateOverview();
void locateToday({respectAnchor: true});
</script>
</body>
</html>
